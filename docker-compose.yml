version: '3.8'

services:
  jarvis:
    build: .
    container_name: seci-jarvis
    ports:
      - "8000:8000"
    volumes:
      # Persist data
      - jarvis-data:/app/data
      # Optional: Mount config
      - ./config:/app/config:ro
    environment:
      - API_PORT=8000
      - ALLOWED_ORIGINS=*
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  jarvis-data:
    driver: local
